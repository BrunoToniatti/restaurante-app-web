<div class="page">
  <div class="page-header">
    <h1 class="page-title">Restaurantes</h1>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [(ngModel)]="search" (input)="applyFilter()" placeholder="Nome ou CNPJ" />
    </mat-form-field>
  </div>

  @if (loading) {
    <div class="loading-center"><mat-spinner diameter="48"></mat-spinner></div>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="filtered" class="full-width">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let r">{{ r.name }}</td>
        </ng-container>
        <ng-container matColumnDef="cnpj">
          <th mat-header-cell *matHeaderCellDef>CNPJ</th>
          <td mat-cell *matCellDef="let r">{{ r.cnpj }}</td>
        </ng-container>
        <ng-container matColumnDef="contact_phone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let r">{{ r.contact_phone }}</td>
        </ng-container>
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Endereço</th>
          <td mat-cell *matCellDef="let r">{{ r.address }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let r">
            <button mat-icon-button color="primary" (click)="openTransfer(r)" matTooltip="Transferir restaurante">
              <mat-icon>swap_horiz</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      @if (filtered.length === 0) {
        <p class="empty">Nenhum restaurante encontrado.</p>
      }
    </mat-card>
  }
</div>
