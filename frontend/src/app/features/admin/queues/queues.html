<div class="page">
  <h1 class="page-title">Filas</h1>

  @if (loading) {
    <div class="loading-center"><mat-spinner diameter="48"></mat-spinner></div>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="queues" class="full-width">
        <ng-container matColumnDef="restaurant_name">
          <th mat-header-cell *matHeaderCellDef>Restaurante</th>
          <td mat-cell *matCellDef="let q">{{ q.restaurant_name }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let q">
            <mat-chip [color]="statusColor(q.status)" highlighted>{{ q.status_display }}</mat-chip>
          </td>
        </ng-container>
        <ng-container matColumnDef="current_size">
          <th mat-header-cell *matHeaderCellDef>Pessoas na fila</th>
          <td mat-cell *matCellDef="let q">{{ q.current_size }}</td>
        </ng-container>
        <ng-container matColumnDef="estimated_wait_minutes">
          <th mat-header-cell *matHeaderCellDef>Espera estimada</th>
          <td mat-cell *matCellDef="let q">{{ q.estimated_wait_minutes }} min</td>
        </ng-container>
        <ng-container matColumnDef="notes">
          <th mat-header-cell *matHeaderCellDef>Observações</th>
          <td mat-cell *matCellDef="let q">{{ q.notes || '—' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      @if (queues.length === 0) {
        <p class="empty">Nenhuma fila encontrada.</p>
      }
    </mat-card>
  }
</div>
