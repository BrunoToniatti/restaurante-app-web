<div class="page">
  <h1 class="page-title">Gerenciar Fila</h1>

  @if (loading) {
    <div class="loading-center"><mat-spinner diameter="48"></mat-spinner></div>
  } @else {
    @if (queue) {
      <div class="status-banner">
        <mat-chip [color]="statusColor(queue.status)" highlighted>{{ queue.status_display }}</mat-chip>
        <span class="queue-name">{{ queue.restaurant_name }}</span>
      </div>
    }

    <mat-card class="form-card">
      <mat-card-header>
        <mat-card-title>Atualizar fila</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="save()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Status da fila</mat-label>
            <mat-select formControlName="status">
              <mat-option value="OPEN">Aberta</mat-option>
              <mat-option value="PAUSED">Pausada</mat-option>
              <mat-option value="CLOSED">Fechada</mat-option>
            </mat-select>
          </mat-form-field>

          <div class="row">
            <mat-form-field appearance="outline" class="half-width">
              <mat-label>Pessoas na fila</mat-label>
              <input matInput type="number" formControlName="current_size" min="0" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="half-width">
              <mat-label>Espera estimada (min)</mat-label>
              <input matInput type="number" formControlName="estimated_wait_minutes" min="0" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Observações (opcional)</mat-label>
            <textarea matInput formControlName="notes" rows="3"></textarea>
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" class="save-btn" [disabled]="saving || form.invalid">
            @if (saving) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Salvar alterações
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  }
</div>
